name: CI/CD

# `main` is listed alongside `master` so a future default-branch rename does not
# silently stop deployments.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Package
        run: mvn -B -ntp verify

  deploy:
    name: Deploy to Render
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Render rejects overlapping deploys; queue them instead of racing.
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK is not set (Render dashboard > Settings > Deploy Hook)."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Deploy requested. Build logs: https://dashboard.render.com"
