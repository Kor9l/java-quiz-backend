quarkus.application.name=java-quiz-backend
quarkus.http.port=${SERVER_PORT:8080}

# Datasource. DB_* are the current names; the SPRING_DATASOURCE_* names the Spring version used
# are still honoured, so an instance already deployed with those keeps booting after the upgrade.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/javaquiz}}
quarkus.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:javaquiz}}
quarkus.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:javaquiz}}

# Flyway owns the schema; Hibernate only checks that the mapping still matches it.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

# Kept at the Spring paths so Render's health check and the compose health check still resolve.
quarkus.smallrye-health.root-path=/actuator/health

# Everything under /api needs a token; the sign-in endpoints and the OAuth2 redirect dance do not.
# Deny-by-default over a path prefix, the way the Spring filter chain drew the same line — an
# endpoint added under /api is closed until it is listed here, rather than open until annotated.
# CORS preflights need no exception: Quarkus answers them before the security layer runs.
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.public.paths=/api/auth/login,/api/auth/register,/api/auth/providers
quarkus.http.auth.permission.public.policy=permit

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=*
quarkus.http.cors.access-control-allow-credentials=true

app.jwt.secret=${JWT_SECRET:dev-secret-change-me-please-use-at-least-32-chars!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost}
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.practice.query-timeout-seconds=${PRACTICE_QUERY_TIMEOUT_SECONDS:5}
app.practice.max-rows=${PRACTICE_MAX_ROWS:500}
app.practice.max-sql-length=${PRACTICE_MAX_SQL_LENGTH:4000}
app.practice.preview-rows=${PRACTICE_PREVIEW_ROWS:50}
