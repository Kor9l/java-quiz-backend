spring:
  application:
    name: java-quiz-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/javaquiz}
    username: ${SPRING_DATASOURCE_USERNAME:javaquiz}
    password: ${SPRING_DATASOURCE_PASSWORD:javaquiz}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-use-at-least-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost}
  frontend-url: ${APP_FRONTEND_URL:http://localhost}
  public-url: ${APP_PUBLIC_URL:http://localhost:8080}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
